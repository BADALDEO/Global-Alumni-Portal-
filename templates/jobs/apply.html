{% extends "base.html" %}
{% block title %}Apply - {{ job.title }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-xl-7">
  <div class="card-soft mb-3"><div class="card-pad d-flex align-items-center gap-3">
    <span class="company-logo">{{ job.company_name|slice:":1"|upper }}</span>
    <div><div class="text-muted small">You are applying for</div><h5 class="mb-0">{{ job.title }}</h5><div class="text-muted small">{{ job.company_name }}</div></div>
  </div></div>
  <div class="card-soft"><div class="card-pad">
    <form method="post" enctype="multipart/form-data">{% csrf_token %}
      {% include "includes/form_fields.html" %}
      <div class="d-flex gap-2">
        <button class="btn btn-gradient"><i class="bi bi-send me-1"></i> Submit application</button>
        <a href="{{ job.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div></div>
</div></div>
{% endblock %}
